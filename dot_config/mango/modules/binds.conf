#                       ▀▀▀                             
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,space,spawn,fuzzel
bind=NONE,XF86LaunchB,spawn,fuzzel
bind=SUPER,Return,spawn,foot
bind=SUPER,Q,spawn,librewolf
bind=SUPER+SHIFT,Q,spawn,qutebrowser
bind=SUPER,E,spawn,thunar

bind=SUPER,A,focusstack,next
bind=SUPER+SHIFT,A,focusmon,right

bind=SUPER,S,toggleglobal,
bind=SUPER,D,tagmon,right

bind=SUPER,F,switch_layout
bind=SUPER,grave,switch_layout

bind=SUPER,z,togglefloating,

bind=SUPER,x,togglemaximizescreen,
bind=SUPER+SHIFT,x,togglefullscreen,
bind=SUPER+CTRL,x,togglefakefullscreen,

bind=SUPER,C,killclient,
bind=SUPER+SHIFT,C,killclient,force 

bind=SUPER,V,minimized,
bind=SUPER+SHIFT,V,restore_minimized
bind=SUPER+CTRL,V,toggle_scratchpad

bind=SUPER,b,toggleoverlay,

# exit
bind=SUPER,m,spawn,wlogout
bind=SUPER+SHIFT,m,quit

bind=SUPER,L,spawn,gtklock
bind=NONE,XF86KbdBrightnessUp,spawn,gtklock

# switch window focus
bind=SUPER+ALT,Left,focusdir,left
bind=SUPER+ALT,Right,focusdir,right
bind=SUPER+ALT,Up,focusdir,up
bind=SUPER+ALT,Down,focusdir,down

# swap window
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right

bind=SUPER,Tab,togglejump,
bind=NONE,XF86LaunchA,toggleoverview,

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=SUPER,Home,scroller_stack,left
bind=SUPER,End,scroller_stack,right
bind=SUPER,Prior,scroller_stack,up
bind=SUPER,Next,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=SHIFT+SUPER,Left,tagtoleft,0
bind=SHIFT+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=SUPER+ALT+SHIFT,Up,movewin,+0,-50
bind=SUPER+ALT+SHIFT,Down,movewin,+0,+50
bind=SUPER+ALT+SHIFT,Left,movewin,-50,+0
bind=SUPER+ALT+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+CTRL+ALT,Up,resizewin,+0,-50
bind=SUPER+CTRL+ALT,Down,resizewin,+0,+50
bind=SUPER+CTRL+ALT,Left,resizewin,-50,+0
bind=SUPER+CTRL+ALT,Right,resizewin,+50,+0

bind=SUPER+SHIFT,T,spawn,waybar
bind=SUPER+CTRL,T,spawn,killall -USR2 waybar
bind=SUPER,T,spawn,killall -USR1 waybar

bind=NONE,XF86Eject,spawn,eject

bind=CTRL+SUPER,P,spawn,$HOME/.config/mango/modules/scripts/screenshot.sh annotate
bind=SHIFT+SUPER,P,spawn,$HOME/.config/mango/modules/scripts/screenshot.sh freeze-region
bind=SUPER,P,spawn,$HOME/.config/mango/modules/scripts/screenshot.sh freeze

bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=SHIFT,XF86AudioPlay,spawn,playerctl stop
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +5  -n 1
bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s +15
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 5-  -n 1
bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 15-

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

# swayosd integration
#bind=NONE,XF86AudioPlay,spawn,swayosd-client --playerctl play-pause
#bind=NONE,XF86AudioNext,spawn,swayosd-client --playerctl next
#bind=NONE,XF86AudioPrev,spawn,swayosd-client --playerctl previous

#bind=NONE,XF86MonBrightnessUp,spawn,swayosd-client --brightness=+5 --min-brightness=1
#bind=SHIFT,XF86MonBrightnessUp,spawn,swayosd-client --brightness=+15 --min-brightness=0
#bind=NONE,XF86MonBrightnessDown,spawn,swayosd-client --brightness=-5 --min-brightness=1
#bind=SHIFT,XF86MonBrightnessDown,spawn,swayosd-client --brightness=-15 --min-brightness=0

#bind=NONE,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume=5 --max-volume 150
#bind=NONE,XF86AudioLowerVolume,spawn,swayosd-client --output-volume=-5 --max-volume 150
#bind=NONE,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle --max-volume 150

bind=NONE,XF86WakeUp,wakeup_monitor

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

gesturebind=none,left,3,viewtoright
gesturebind=none,right,3,viewtoleft
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview
